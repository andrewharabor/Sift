name: Build Sift

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-24.04
            artifact: Sift-linux_x64-native
            executable: Sift

          - name: Windows x64
            os: windows-latest
            artifact: Sift-windows_x64-native
            executable: Sift.exe

          - name: macOS ARM64
            os: macos-15
            artifact: Sift-macos_arm64-native
            executable: Sift

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Linux toolchain
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y make clang lld curl

      - name: Install macOS toolchain
        if: runner.os == 'macOS'
        run: |
          brew install llvm lld
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix lld)/bin" >> "$GITHUB_PATH"

      - name: Install Windows toolchain
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: >-
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-lld
            mingw-w64-clang-x86_64-make
            curl

      - name: Build Linux and macOS
        if: runner.os != 'Windows'
        shell: bash
        run: |
          clang++ --version
          make -j2 engine \
            CXX=clang++ \
            ARCH=native \
            MODE=release \
            NUMA=off \
            EXE="${{ matrix.executable }}"

      - name: Build Windows
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          clang++ --version
          mingw32-make -j2 engine \
            CXX=clang++ \
            OS=Windows_NT \
            SHELL=cmd.exe \
            '.SHELLFLAGS=/c' \
            ARCH=native \
            MODE=release \
            NUMA=off \
            EXE="${{ matrix.executable }}"

      - name: UCI Startup on Linux and macOS
        if: runner.os != 'Windows'
        shell: bash
        run: |
          printf 'uci\nisready\nquit\n' | ./"${{ matrix.executable }}"

    #   - name: UCI Startup on Windows
    #     if: runner.os == 'Windows'
    #     shell: msys2 {0}
    #     run: |
    #       printf 'uci\nisready\nquit\n' | ./"${{ matrix.executable }}"

      - name: Diagnose Windows UCI shutdown
        if: runner.os == 'Windows'
        timeout-minutes: 5
        shell: pwsh
        run: |
          $exe = Join-Path $PWD "${{ matrix.executable }}"
          $inputFile = Join-Path $PWD "uci-input.txt"

          "uci`nisready`nquit" |
            Set-Content -Path $inputFile -Encoding ascii

          $process = Start-Process `
            -FilePath $exe `
            -RedirectStandardInput $inputFile `
            -NoNewWindow `
            -Wait `
            -PassThru

          $code = [int]$process.ExitCode
          $unsigned = [BitConverter]::ToUInt32(
            [BitConverter]::GetBytes($code), 0
          )

          Write-Host ("Sift exit code: {0} (0x{1:X8})" -f $code, $unsigned)

          if ($code -ne 0) {
            exit 1
          }

      - name: Bench on Linux and macOS
        if: runner.os != 'Windows'
        timeout-minutes: 5
        shell: bash
        run: ./"${{ matrix.executable }}" bench

      - name: Bench on Windows
        if: runner.os == 'Windows'
        timeout-minutes: 5
        shell: msys2 {0}
        run: ./"${{ matrix.executable }}" bench
