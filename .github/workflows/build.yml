name: Build Sift

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-24.04
            artifact: Sift-linux_x64
            executable: Sift

          - name: Windows x64
            os: windows-latest
            artifact: Sift-windows_x64
            executable: Sift.exe

          - name: macOS ARM64
            os: macos-15
            artifact: Sift-macos_arm64
            executable: Sift

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install Linux toolchain
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y make clang lld curl git

      - name: Install macOS toolchain
        if: runner.os == 'macOS'
        run: |
          brew install llvm lld git
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix lld)/bin" >> "$GITHUB_PATH"

      - name: Install Windows toolchain
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: >-
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-lld
            mingw-w64-clang-x86_64-make
            curl
            git

      - name: Build Linux and macOS
        if: runner.os != 'Windows'
        shell: bash
        run: |
          clang++ --version
          make -j2 engine \
            CXX=clang++ \
            ARCH=native \
            MODE=release \
            NUMA=off \
            EXE="${{ matrix.executable }}"

      - name: Build Windows
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          clang++ --version
          mingw32-make -j2 engine \
            CXX=clang++ \
            OS=Windows_NT \
            SHELL=cmd.exe \
            '.SHELLFLAGS=/c' \
            ARCH=native \
            MODE=release \
            NUMA=off \
            EXE="${{ matrix.executable }}"

      - name: UCI startup on Linux and macOS
        if: runner.os != 'Windows'
        shell: bash
        run: |
          printf 'uci\nisready\nquit\n' | ./"${{ matrix.executable }}"

      - name: UCI startup on Windows
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          printf 'uci\nisready\nquit\n' | ./"${{ matrix.executable }}"

      - name: Bench on Linux and macOS
        if: runner.os != 'Windows'
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          expected=$(git log -1 --format=%B | awk '$1 == "bench:" {print $2}')
          ./"${{ matrix.executable }}" bench > output
          actual=$(tail -n 1 output | awk '{print $2}' | tr -d '\r')
          echo "Bench: got $actual, expected $expected"
          [[ -n "$expected" && "$actual" == "$expected" ]]

      - name: Bench on Windows
        if: runner.os == 'Windows'
        timeout-minutes: 5
        shell: msys2 {0}
        run: |
          set -euo pipefail
          expected=$(git log -1 --format=%B | awk '$1 == "bench:" {print $2}')
          ./"${{ matrix.executable }}" bench > output
          actual=$(tail -n 1 output | awk '{print $2}' | tr -d '\r')
          echo "Bench: got $actual, expected $expected"
          [[ -n "$expected" && "$actual" == "$expected" ]]
