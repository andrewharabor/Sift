name: Build Sift

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-24.04
            artifact: sift-linux-x64-native
            executable: sift

          - name: Windows x64
            os: windows-latest
            artifact: sift-windows-x64-native
            executable: sift.exe

          - name: macOS ARM64
            os: macos-15
            artifact: sift-macos-arm64-native
            executable: sift

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Linux toolchain
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y make clang lld curl

      - name: Install macOS toolchain
        if: runner.os == 'macOS'
        run: |
          brew install llvm lld
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix lld)/bin" >> "$GITHUB_PATH"

      - name: Install Windows toolchain
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: >-
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-lld
            mingw-w64-clang-x86_64-make
            curl

      - name: Build Linux and macOS
        if: runner.os != 'Windows'
        shell: bash
        run: |
          clang++ --version
          make -j2 engine \
            CXX=clang++ \
            ARCH=native \
            MODE=release \
            NUMA=off \
            EXE="${{ matrix.executable }}"

      - name: Build Windows
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          clang++ --version
          mingw32-make -j2 engine \
            CXX=clang++ \
            OS=Windows_NT \
            SHELL=cmd.exe \
            '.SHELLFLAGS=/c' \
            ARCH=native \
            MODE=release \
            NUMA=off \
            EXE="${{ matrix.executable }}"

      - name: Check UCI startup on Linux and macOS
        if: runner.os != 'Windows'
        shell: bash
        run: |
          printf 'uci\nisready\nquit\n' |
            ./"${{ matrix.executable }}" > uci-output.txt
          cat uci-output.txt
          grep -q '^uciok' uci-output.txt
          grep -q '^readyok' uci-output.txt

      - name: Check UCI startup on Windows
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          printf 'uci\nisready\nquit\n' |
            ./"${{ matrix.executable }}" > uci-output.txt
          cat uci-output.txt
          grep -q '^uciok' uci-output.txt
          grep -q '^readyok' uci-output.txt

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.executable }}
          if-no-files-found: error
